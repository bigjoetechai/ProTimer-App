appId: com.protimer.desktop
productName: ProTimer
executableName: ProTimer
copyright: Copyright © 2026 Bigjoe Technology

npmRebuild: false
buildDependenciesFromSource: false
beforePack: scripts/prepare-build-assets.cjs

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - electron/**/*
  - server.ts
  - server/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
  - node_modules/**/*
  - "!node_modules/electron/**/*"
  - "!node_modules/electron-builder/**/*"
  - "!node_modules/app-builder-bin/**/*"
  - "!node_modules/typescript/**/*"
  - "!node_modules/vite/**/*"
  - "!node_modules/@vitejs/**/*"
  - "!node_modules/@tailwindcss/**/*"
  - "!node_modules/tailwindcss/**/*"
  - "!node_modules/esbuild/**/*"
  - "!node_modules/@esbuild/**/*"

publish:
  - provider: github
    owner: bigjoetechai
    repo: ProTimer-App
    releaseType: release

asar: true
asarUnpack:
  - dist/**/*
  - node_modules/koffi/**/*
  - server/**/*
  - server.ts

compression: normal

win:
  icon: build/icon.ico
  executableName: ProTimer
  signAndEditExecutable: true
  extraResources:
    - from: ndi
      to: ndi
      filter:
        - "**/*"
        - "!*.dylib"
        - "!*.so*"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProTimer
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ProTimer-v${version}-Setup.exe
  uninstallDisplayName: ProTimer

portable:
  artifactName: ProTimer-v${version}-Portable.exe

mac:
  icon: build/icon.png
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ProTimer-v${version}-Mac-${arch}.${ext}
  extraResources:
    - from: ndi
      to: ndi
      filter:
        - "**/*"
        - "!*.dll"
        - "!*.so*"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  sign: false
  artifactName: ProTimer-v${version}-Mac-${arch}.${ext}

linux:
  icon: build/icon.png
  category: AudioVideo
  executableName: protimer
  maintainer: Bigjoe Technology <support@protimer.app>
  artifactName: ProTimer-v${version}-Linux-${arch}.${ext}
  extraResources:
    - from: ndi
      to: ndi
      filter:
        - "**/*"
        - "!*.dll"
        - "!*.dylib"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
