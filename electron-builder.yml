appId: com.protimer.desktop
productName: ProTimer
executableName: ProTimer
copyright: Copyright © 2026 ProTimer

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - electron/**/*
  - server/ndiNativeBridge.cjs
  - build/icon.ico
  - build/icon.png
  - package.json
  - "!node_modules/**/*"
  - node_modules/koffi/index.js
  - node_modules/koffi/package.json
  - node_modules/koffi/build/koffi/win32_x64/**/*
  - node_modules/koffi/build/koffi/linux_x64/**/*

asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - server/ndiNativeBridge.cjs

extraResources:
  - from: ndi
    to: ndi
    filter:
      - "**/*"

compression: store

win:
  icon: build/icon.ico
  executableName: ProTimer
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProTimer
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ProTimer-Setup.exe
  uninstallDisplayName: ProTimer

portable:
  artifactName: ProTimer-Portable.exe
