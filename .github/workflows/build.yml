name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: ProTimer-Windows
          path: dist/*.exe
