name: Build & Publish Windows Installer Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Icons & Bundled NDI Runtime
        run: node scripts/prepare-build-assets.cjs

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build Windows Installer (without publishing on branch push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build & Publish Windows Installer to GitHub Releases (on version tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows Release Assets to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            release/ProTimer-Setup.exe
            release/ProTimer-Setup.exe.blockmap
            release/ProTimer-Portable.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows .EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProTimer-Windows-v2.5.0
          path: |
            release/ProTimer-Setup.exe
            release/ProTimer-Portable.exe
            release/latest.yml
