name: Build & Publish Cross-Platform Releases (Windows, macOS & Linux)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version & Tag from Git Ref or package.json
        id: pkg
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' so pushed tags like v3.0.2 always stamp 3.0.2 into installers & latest*.yml
            TAG_VER="${TAG_NAME#v}"
            if [[ "${TAG_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              RESOLVED_VER="${TAG_VER}"
            else
              RESOLVED_VER="${PKG_VER}"
            fi
          else
            RESOLVED_VER="${PKG_VER}"
            TAG_NAME="v${PKG_VER}"
          fi
          echo "version=${RESOLVED_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved Release Tag: ${TAG_NAME} (version ${RESOLVED_VER}, repo ${GITHUB_REPOSITORY})"

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Release Version & Repository Metadata
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            pkg.repository = { type: 'git', url: 'https://github.com/${{ github.repository }}.git' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Icons & Bundled NDI Runtime
        run: node scripts/prepare-build-assets.cjs --win

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build Windows Installer & Portable (x64)
        run: >-
          npx electron-builder --win --x64 --publish never
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Generated Windows Files & Auto-Update Metadata
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          ls -lh release/
          test -f "release/ProTimer-v${VER}-Setup.exe"
          test -f "release/ProTimer-v${VER}-Setup.exe.blockmap"
          test -f "release/ProTimer-v${VER}-Portable.exe"
          test -f release/latest.yml
          cat release/latest.yml

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProTimer-Windows-${{ needs.prepare.outputs.tag }}
          path: |
            release/ProTimer-v*-Setup.exe
            release/ProTimer-v*-Setup.exe.blockmap
            release/ProTimer-v*-Portable.exe
            release/latest.yml

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Release Version & Repository Metadata
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            pkg.repository = { type: 'git', url: 'https://github.com/${{ github.repository }}.git' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Icons & Server Bundle
        run: node scripts/prepare-build-assets.cjs

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build macOS Apple Silicon (arm64) & Intel (x64)
        run: >-
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Generated macOS Files & Auto-Update Metadata
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          ls -lh release/
          test -f "release/ProTimer-v${VER}-Mac-arm64.dmg"
          test -f "release/ProTimer-v${VER}-Mac-arm64.zip"
          test -f "release/ProTimer-v${VER}-Mac-x64.dmg"
          test -f "release/ProTimer-v${VER}-Mac-x64.zip"
          test -f release/latest-mac.yml
          cat release/latest-mac.yml

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProTimer-macOS-${{ needs.prepare.outputs.tag }}
          path: |
            release/ProTimer-v*.dmg
            release/ProTimer-v*.zip
            release/ProTimer-v*.blockmap
            release/latest-mac.yml

  build-linux:
    name: Build Linux (x64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Release Version & Repository Metadata
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            pkg.repository = { type: 'git', url: 'https://github.com/${{ github.repository }}.git' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Icons & Server Bundle
        run: node scripts/prepare-build-assets.cjs

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build Linux AppImage & Debian Package (x64)
        run: >-
          npx electron-builder --linux AppImage deb --x64 --publish never
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Generated Linux Files & Auto-Update Metadata
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          ls -lh release/
          compgen -G "release/ProTimer-v${VER}-Linux-*.AppImage" > /dev/null
          compgen -G "release/ProTimer-v${VER}-Linux-*.deb" > /dev/null
          test -f release/latest-linux.yml
          cat release/latest-linux.yml

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProTimer-Linux-${{ needs.prepare.outputs.tag }}
          path: |
            release/ProTimer-v*.AppImage
            release/ProTimer-v*.AppImage.blockmap
            release/ProTimer-v*.deb
            release/latest-linux.yml

  publish-release:
    name: Publish GitHub Release (Windows, macOS & Linux)
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Collected Release Assets & Updater Manifests
        shell: bash
        run: |
          ls -lh release-assets/
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest-linux.yml

      - name: Publish All Distributions to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ProTimer ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
