name: Build ProTimer Windows .EXE & Publish Release on Version Tag

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate build/ Icons & Prepare NDI Runtime
        run: node scripts/prepare-build-assets.cjs

      - name: Commit build/ Folder Icons to GitHub Repository (if on branch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/icon.ico build/icon.png build/icon_ec9a41ea.png build/installerIcon.ico build/uninstallerIcon.ico build/installerHeaderIcon.ico
          if ! git diff --cached --quiet; then
            git commit -m "chore: add build/ folder icons for Windows .exe packaging [skip ci]"
            git push || true
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Package Windows 64-bit Installer (Branch Build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package & Publish Windows 64-bit Installer to GitHub Releases (Tag Push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Ensure GitHub Release Contains All Auto-Updater Assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            release/ProTimer-Setup.exe
            release/ProTimer-Setup.exe.blockmap
            release/ProTimer-Portable.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows .EXE Deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ProTimer-Windows-v2.5.0
          path: |
            release/ProTimer-Setup.exe
            release/ProTimer-Portable.exe
            release/latest.yml
